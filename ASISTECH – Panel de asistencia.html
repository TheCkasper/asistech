<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASISTECH – Panel de asistencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F5F9;
    --surface: #FFFFFF;
    --ink: #0E1A33;
    --muted: #53607A;
    --line: #D9DFEA;
    --brand: #1740C9;
    --band: #1740C9;
    --fresh: #E4EBFF;
    --ok: #12805C;
    --late: #9A5B00;
    --late-fill: #F5A524;
    --alta: #B42318;
    --media: #9A5B00;
    --baja: #53607A;
    --f-display: 'Unbounded', 'Segoe UI', system-ui, sans-serif;
    --f-body: 'Onest', 'Segoe UI', system-ui, sans-serif;
    color-scheme: light dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1426;
      --surface: #152039;
      --ink: #E8EDF8;
      --muted: #9AA7C2;
      --line: #2A3553;
      --brand: #8FA6FF;
      --fresh: #23325E;
      --ok: #3DD598;
      --late: #F5B74A;
      --alta: #FF7A70;
      --media: #F5B74A;
      --baja: #9AA7C2;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D1426;
    --surface: #152039;
    --ink: #E8EDF8;
    --muted: #9AA7C2;
    --line: #2A3553;
    --brand: #8FA6FF;
    --fresh: #23325E;
    --ok: #3DD598;
    --late: #F5B74A;
    --alta: #FF7A70;
    --media: #F5B74A;
    --baja: #9AA7C2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); line-height: 1.5; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 24px 16px 64px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  h1, h2 { margin: 0; }

  /* Cabecera */
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; margin-bottom: 18px; }
  .brand h1 { font-family: var(--f-display); font-weight: 600; font-size: 1.35rem; letter-spacing: .02em; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; text-transform: capitalize; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: .9rem; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .chip.ok .dot { background: var(--ok); }
  .chip.off { border-color: var(--alta); color: var(--alta); }
  .chip.off .dot { background: var(--alta); }
  .chip.demo .dot { background: var(--late-fill); }

  /* Última lectura: el momento central del panel */
  .last { display: flex; align-items: center; gap: 18px; padding: 22px 24px; border-radius: 14px; background: var(--band); color: #fff; }
  .pulse { position: relative; flex: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
  .pulse.go::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid #fff; animation: ring 1.1s ease-out 1; }
  @keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(3.2); opacity: 0; } }
  .last-name { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.25rem, 3.6vw, 2.2rem); line-height: 1.15; overflow-wrap: anywhere; }
  .last-meta { margin: 6px 0 0; font-size: 1rem; opacity: .92; }

  /* Indicadores */
  .kpis { display: flex; flex-wrap: wrap; margin: 22px 0; }
  .kpi { flex: 1 1 200px; padding: 4px 22px; border-left: 1px solid var(--line); }
  .kpi:first-child { border-left: 0; padding-left: 0; }
  .kpi .v { font-family: var(--f-display); font-weight: 600; font-size: 2rem; line-height: 1.2; }
  .kpi .l { font-weight: 500; }
  .kpi .s { color: var(--muted); font-size: .9rem; }

  /* Paneles */
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
  .stack { display: grid; gap: 20px; min-width: 0; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .panel h2 { font-size: 1.05rem; font-weight: 600; }
  .panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .hint { margin: 2px 0 14px; color: var(--muted); font-size: .9rem; }

  /* Gráfica */
  .chart { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 3px; align-items: end; height: 130px; }
  .bar { background: var(--brand); border-radius: 3px 3px 0 0; min-height: 3px; transition: height .35s ease; }
  .bar.late { background: var(--late-fill); }
  .bar.zero { background: var(--line); }
  .axis { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 3px; margin-top: 6px; font-size: .78rem; color: var(--muted); }
  .axis span { white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: .88rem; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  /* Lecturas en vivo */
  .search { font: inherit; min-height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: inherit; min-width: 0; flex: 0 1 240px; }
  .feed { list-style: none; margin: 0; padding: 0; max-height: 460px; overflow-y: auto; border-top: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .row.fresh { animation: fresh 2.2s ease-out 1; }
  @keyframes fresh { from { background: var(--fresh); } to { background: transparent; } }
  .row time { font-variant-numeric: tabular-nums; color: var(--muted); }
  .row .who { overflow-wrap: anywhere; }
  .row .who small { display: block; color: var(--muted); font-size: .85rem; }
  .badge { font-size: .85rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .badge.ok { color: var(--ok); }
  .badge.late { color: var(--late); }
  .badge.rep { color: var(--muted); }
  .badge.out { color: var(--brand); }
  .empty { padding: 24px 4px; color: var(--muted); }

  /* Alertas de la IA */
  .alerts { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .alert { padding: 2px 0 2px 14px; border-left: 4px solid var(--c); }
  .alert.alta { --c: var(--alta); }
  .alert.media { --c: var(--media); }
  .alert.baja { --c: var(--baja); }
  .alert .sev { font-weight: 600; color: var(--c); font-size: .88rem; }
  .alert h3 { margin: 0; font-size: 1rem; font-weight: 600; }
  .alert .who { margin: 0; color: var(--muted); font-size: .9rem; }
  .alert p.desc { margin: 6px 0; font-size: .94rem; }
  .alert .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; color: var(--muted); font-size: .86rem; }
  button { font: inherit; cursor: pointer; min-height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
  button:hover { border-color: var(--muted); }
  .msg { min-height: 1.4em; margin: 10px 0 0; color: var(--alta); font-size: .9rem; }

  @media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) {
    .kpi { flex-basis: 45%; border-left: 0; padding: 8px 0; }
    .last { padding: 18px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>ASISTECH</h1>
      <p id="subtitle"></p>
    </div>
    <span id="conn" class="chip" role="status"><span class="dot" aria-hidden="true"></span><span id="connText"></span></span>
  </header>

  <section class="last" aria-label="Última lectura">
    <span id="pulse" class="pulse" aria-hidden="true"></span>
    <div aria-live="polite">
      <div id="lastName" class="last-name"></div>
      <p id="lastMeta" class="last-meta"></p>
    </div>
  </section>

  <section class="kpis" aria-label="Resumen del día">
    <div class="kpi"><div class="v" id="kPresentes">0</div><div class="l">Presentes</div><div class="s" id="kPresentesSub"></div></div>
    <div class="kpi"><div class="v" id="kPct">&mdash;</div><div class="l">Asistencia</div><div class="s">de los estudiantes registrados</div></div>
    <div class="kpi"><div class="v" id="kTarde">0</div><div class="l">Llegaron tarde</div><div class="s" id="kTardeSub"></div></div>
    <div class="kpi"><div class="v" id="kAlertas">0</div><div class="l">Alertas abiertas</div><div class="s">por revisar</div></div>
  </section>

  <div class="cols">
    <div class="stack">
      <section class="panel" aria-labelledby="hChart">
        <h2 id="hChart">Entradas cada 15 minutos</h2>
        <p class="hint" id="chartHint"></p>
        <div id="chart" class="chart" role="img"></div>
        <div id="axis" class="axis" aria-hidden="true"></div>
        <div class="legend" id="chartLegend"></div>
      </section>

      <section class="panel" aria-labelledby="hFeed">
        <div class="panel-head">
          <h2 id="hFeed">Lecturas en vivo</h2>
          <label class="sr-only" for="search">Buscar por nombre</label>
          <input id="search" class="search" type="search" placeholder="Buscar por nombre" autocomplete="off">
        </div>
        <ul id="feed" class="feed"></ul>
      </section>
    </div>

    <aside class="panel" aria-labelledby="hAlerts">
      <h2 id="hAlerts">Alertas de la IA</h2>
      <p class="hint">Patrones inusuales que detectó el modelo en los registros.</p>
      <ul id="alerts" class="alerts"></ul>
      <p id="msg" class="msg" role="status"></p>
    </aside>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* =====================================================================
     CONFIGURACIÓN
     - API_BASE vacío   -> modo demo con datos simulados.
     - API_BASE con URL -> consulta la API real, ej. 'http://192.168.1.25:8000'
       (IP de Emanuel). Usa http, no https, mientras la API siga en la LAN.

     Para abrir el panel sin problemas de CORS, sírvelo desde esta carpeta con:
         python -m http.server 5173
     y entra a http://localhost:5173/asistech_dashboard.html
     (ese origen debe estar permitido en CORS de la API; ver README, sección 11).

     Contrato que debe exponer la API (ver dashboard_api.py):
       GET   /api/dashboard?id_establecimiento=1
             -> { total_estudiantes: 420,
                  lecturas: [{ id_registro, uid_nfc, nombre, grado, tipo_registro, fecha_hora }],
                  alertas:  [{ id_alerta, nombre, grado, tipo, severidad, puntaje, descripcion }] }
             tipo_registro: 'ENTRADA' | 'SALIDA'
             fecha_hora: ISO 8601 en UTC con 'Z' (como la guarda la BD)
             severidad: 'alta' | 'media' | 'baja'     puntaje: 0 a 1
       PATCH /api/alertas/{id_alerta}   cuerpo: { "revisada": true }

     Las horas se muestran siempre en hora de Guatemala (UTC-6),
     sin importar la zona horaria del dispositivo.
     ===================================================================== */
  const CONFIG = {
    API_BASE: '',
    ID_ESTABLECIMIENTO: 1,
    INTERVALO_MS: 5000,        // cada cuánto consulta la API
    TARDE_DESDE: '07:30',      // desde esta hora la entrada se marca como tarde (hora de Guatemala)
    GRAFICA_DESDE: 6,          // hora de inicio de la gráfica
    GRAFICA_HASTA: 9,          // hora de fin de la gráfica
    INSTITUCION: 'Nombre del centro educativo',
    DEMO_CADA_MS: 1500         // velocidad de la simulación
  };
  const TZ = 'America/Guatemala';

  const TIPOS = {
    ausencias_recurrentes: 'Ausencias recurrentes',
    tardanzas_crecientes: 'Tardanzas en aumento',
    lectura_duplicada: 'Lecturas duplicadas'
  };
  const SEVERIDAD = { alta: 'Prioridad alta', media: 'Prioridad media', baja: 'Prioridad baja' };

  /* ---------- Utilidades de fecha (siempre en hora de Guatemala) ---------- */
  const $ = (s) => document.querySelector(s);
  const pad = (n) => String(n).padStart(2, '0');
  const FMT = new Intl.DateTimeFormat('en-GB', {
    timeZone: TZ, hourCycle: 'h23',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
  function toDate(v) {
    if (v instanceof Date) return v;
    let s = String(v);
    if (!/(Z|[+-]\d\d:?\d\d)$/.test(s)) s += 'Z'; // sin zona horaria: la BD guarda UTC
    return new Date(s);
  }
  function gt(v) {
    const o = {};
    FMT.formatToParts(toDate(v)).forEach((p) => { o[p.type] = p.value; });
    return { y: +o.year, mo: +o.month, d: +o.day, h: +o.hour, mi: +o.minute, s: +o.second };
  }
  const hhmm = (v) => { const p = gt(v); return pad(p.h) + ':' + pad(p.mi); };
  const hhmmss = (v) => { const p = gt(v); return pad(p.h) + ':' + pad(p.mi) + ':' + pad(p.s); };
  const minutesOf = (v) => { const p = gt(v); return p.h * 60 + p.mi; };

  const LATE_MIN = (() => { const p = CONFIG.TARDE_DESDE.split(':').map(Number); return p[0] * 60 + p[1]; })();
  const isLate = (v) => minutesOf(v) >= LATE_MIN;

  function h(tag, attrs = {}, ...kids) {
    const el = document.createElement(tag);
    Object.keys(attrs).forEach((k) => {
      const v = attrs[k];
      if (v === false || v == null) return;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v);
    });
    kids.flat().forEach((kid) => { if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid)); });
    return el;
  }

  /* ---------- Estado ---------- */
  const demo = !CONFIG.API_BASE;
  const state = { total: 0, lecturas: [], alertas: [], connected: demo ? null : false, updated: null, filter: '' };
  let renderedKeys = new Set();
  let lastKey = null;

  /* ---------- Datos de demostración ---------- */
  let demoAll = [];
  let demoShown = 0;
  let demoTimer = null;
  function buildDemo() {
    const FIRST = ['Ana Luc\u00eda', 'Carlos', 'Mar\u00eda Jos\u00e9', 'Luis', 'Rosa', 'Pedro', 'Sof\u00eda', 'Diego', 'Andrea', 'Kevin', 'Lesly', 'Brayan', 'Mishell', 'Jonathan', 'Heidi', 'Elmer'];
    const SUR = ['Caal', 'Choc', 'Pop', 'Cucul', 'Xol', 'Tiul', 'Coc', 'Cac', 'Ical', 'Max', 'Tut', 'Chub'];
    const GR = ['1ro B\u00e1sico A', '1ro B\u00e1sico B', '2do B\u00e1sico A', '3ro B\u00e1sico A'];
    const est = [];
    for (let i = 0; i < 48; i++) {
      est.push({
        uid: '04' + (0xA10000 + i * 977).toString(16).toUpperCase(),
        nombre: FIRST[i % 16] + ' ' + SUR[(i * 5) % 12] + ' ' + SUR[(i * 7 + 3) % 12],
        grado: GR[i % 4]
      });
    }
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const g = gt(new Date());
    const base = Date.UTC(g.y, g.mo - 1, g.d, 6 + 6, 30, 0); // 06:30 en Guatemala = 12:30 UTC
    const taps = est.slice(0, 42).map((s) => {
      const off = (rnd() + rnd() + rnd()) / 3 * 100;
      return { uid: s.uid, nombre: s.nombre, grado: s.grado, tipo: 'ENTRADA', t: base + off * 60000 };
    });
    taps.sort((a, b) => a.t - b.t);
    [8, 20].forEach((i) => taps.push({ uid: taps[i].uid, nombre: taps[i].nombre, grado: taps[i].grado, tipo: 'ENTRADA', t: taps[i].t + 40000 }));
    [0, 1].forEach((i, k) => taps.push({ uid: taps[i].uid, nombre: taps[i].nombre, grado: taps[i].grado, tipo: 'SALIDA', t: base + (360 + k * 7) * 60000 })); // ~12:30 en Guatemala
    taps.sort((a, b) => a.t - b.t);
    demoAll = taps.map((x, i) => ({ id_registro: i + 1, uid_nfc: x.uid, nombre: x.nombre, grado: x.grado, tipo_registro: x.tipo, fecha_hora: new Date(x.t).toISOString() }));
    state.total = est.length;
    state.alertas = [
      { id_alerta: 1, nombre: est[3].nombre, grado: est[3].grado, tipo: 'ausencias_recurrentes', severidad: 'alta', puntaje: 0.91, descripcion: 'Falt\u00f3 4 de los \u00faltimos 5 lunes. El patr\u00f3n es poco habitual frente a su historial.' },
      { id_alerta: 2, nombre: est[17].nombre, grado: est[17].grado, tipo: 'tardanzas_crecientes', severidad: 'media', puntaje: 0.74, descripcion: 'Sus llegadas tarde pasaron de 1 a 6 en las \u00faltimas tres semanas.' },
      { id_alerta: 3, nombre: est[30].nombre, grado: est[30].grado, tipo: 'lectura_duplicada', severidad: 'baja', puntaje: 0.58, descripcion: 'Su tarjeta se ley\u00f3 dos veces en menos de un minuto. Puede ser una lectura repetida del tel\u00e9fono.' }
    ];
    demoShown = 12;
    state.lecturas = demoAll.slice(0, demoShown);
  }

  /* ---------- Cálculos ---------- */
  function derive() {
    const lect = state.lecturas
      .map((l) => Object.assign({}, l, { _t: toDate(l.fecha_hora) }))
      .sort((a, b) => a._t - b._t);
    const seen = {};
    const firstIn = {};
    const items = lect.map((l) => {
      const tipo = l.tipo_registro === 'SALIDA' ? 'SALIDA' : 'ENTRADA';
      const k = l.uid_nfc + '|' + tipo;
      const rep = !!seen[k];
      seen[k] = true;
      if (tipo === 'ENTRADA' && !rep) firstIn[l.uid_nfc] = l;
      return {
        l, tipo, rep,
        late: tipo === 'ENTRADA' && isLate(l._t),
        key: String(l.id_registro != null ? l.id_registro : l.uid_nfc + l.fecha_hora)
      };
    });
    const firsts = Object.keys(firstIn).map((u) => firstIn[u]);
    return { items, firsts, presentes: firsts.length, tarde: firsts.filter((l) => isLate(l._t)).length };
  }

  /* ---------- Render ---------- */
  function renderStatus() {
    const c = $('#conn');
    c.className = 'chip ' + (demo ? 'demo' : state.connected ? 'ok' : 'off');
    $('#connText').textContent = demo
      ? 'Modo demo \u00b7 datos simulados'
      : state.connected
        ? 'Conectado \u00b7 actualizado ' + hhmmss(state.updated)
        : 'Sin conexi\u00f3n con la API \u00b7 reintentando';
  }

  function renderLast(d) {
    const last = d.items.length ? d.items[d.items.length - 1] : null;
    if (!last) {
      $('#lastName').textContent = 'Esperando la primera lectura';
      $('#lastMeta').textContent = 'Acerca una tarjeta NFC al tel\u00e9fono para registrar la entrada.';
      return;
    }
    $('#lastName').textContent = last.l.nombre;
    const estado = last.tipo === 'SALIDA' ? 'Salida' : last.rep ? 'Lectura repetida' : last.late ? 'Lleg\u00f3 tarde' : 'Lleg\u00f3 a tiempo';
    $('#lastMeta').textContent = estado + ' \u00b7 ' + hhmm(last.l._t) + (last.l.grado ? ' \u00b7 ' + last.l.grado : '');
    if (lastKey !== null && lastKey !== last.key) {
      const p = $('#pulse');
      p.classList.remove('go'); void p.offsetWidth; p.classList.add('go');
    }
    lastKey = last.key;
  }

  function renderKpis(d) {
    $('#kPresentes').textContent = d.presentes;
    $('#kPresentesSub').textContent = state.total ? 'de ' + state.total + ' estudiantes' : 'estudiantes que marcaron entrada hoy';
    $('#kPct').textContent = state.total ? Math.round(d.presentes / state.total * 100) + '%' : '\u2014';
    $('#kTarde').textContent = d.tarde;
    $('#kTardeSub').textContent = 'desde las ' + CONFIG.TARDE_DESDE;
    $('#kAlertas').textContent = state.alertas.length;
  }

  function renderChart(d) {
    const start = CONFIG.GRAFICA_DESDE * 60;
    const end = CONFIG.GRAFICA_HASTA * 60;
    const n = Math.max(1, Math.round((end - start) / 15));
    const buckets = new Array(n).fill(0);
    d.firsts.forEach((l) => {
      let i = Math.floor((minutesOf(l._t) - start) / 15);
      i = Math.min(n - 1, Math.max(0, i));
      buckets[i]++;
    });
    const max = Math.max(1, ...buckets);
    let peak = 0;
    buckets.forEach((v, i) => { if (v > buckets[peak]) peak = i; });

    const chart = $('#chart');
    const axis = $('#axis');
    chart.style.setProperty('--cols', n);
    axis.style.setProperty('--cols', n);
    chart.textContent = '';
    axis.textContent = '';
    buckets.forEach((v, i) => {
      const from = start + i * 15;
      const late = from >= LATE_MIN;
      chart.append(h('div', {
        class: 'bar' + (late ? ' late' : '') + (v === 0 ? ' zero' : ''),
        style: 'height:' + (v === 0 ? 3 : Math.max(6, Math.round(v / max * 100))) + '%',
        title: pad(Math.floor(from / 60)) + ':' + pad(from % 60) + ' \u2013 ' + v + (v === 1 ? ' entrada' : ' entradas')
      }));
      axis.append(h('span', {}, from % 60 === 0 ? pad(from / 60) + ':00' : ''));
    });
    $('#chartHint').textContent = d.presentes
      ? 'La franja m\u00e1s concurrida es la de las ' + pad(Math.floor((start + peak * 15) / 60)) + ':' + pad((start + peak * 15) % 60) + ', con ' + buckets[peak] + (buckets[peak] === 1 ? ' entrada.' : ' entradas.')
      : 'Todav\u00eda no hay entradas hoy.';
    chart.setAttribute('aria-label', $('#chartHint').textContent);

    const legend = $('#chartLegend');
    legend.textContent = '';
    legend.append(
      h('span', {}, h('i', { style: 'background:var(--brand)' }), 'A tiempo'),
      h('span', {}, h('i', { style: 'background:var(--late-fill)' }), 'Desde las ' + CONFIG.TARDE_DESDE + ' (tarde)')
    );
  }

  function renderFeed(d) {
    const feed = $('#feed');
    const q = state.filter.trim().toLowerCase();
    const rows = d.items.slice().reverse().filter((x) => !q || String(x.l.nombre).toLowerCase().includes(q)).slice(0, 80);
    const nextKeys = new Set();
    feed.textContent = '';
    if (!rows.length) {
      feed.append(h('li', { class: 'empty' }, q
        ? 'Nadie coincide con \u201c' + state.filter.trim() + '\u201d.'
        : 'A\u00fan no hay lecturas hoy. Acerca una tarjeta NFC al tel\u00e9fono para registrar la primera.'));
      renderedKeys = nextKeys;
      return;
    }
    rows.forEach((x) => {
      nextKeys.add(x.key);
      const fresh = renderedKeys.size > 0 && !renderedKeys.has(x.key);
      feed.append(h('li', { class: 'row' + (fresh ? ' fresh' : '') },
        h('time', { datetime: x.l._t.toISOString() }, hhmm(x.l._t)),
        h('div', { class: 'who' }, x.l.nombre, x.l.grado ? h('small', {}, x.l.grado) : null),
        x.tipo === 'SALIDA' ? h('span', { class: 'badge out' }, 'Salida')
          : x.rep ? h('span', { class: 'badge rep' }, 'Repetida')
          : x.late ? h('span', { class: 'badge late' }, 'Tarde')
          : h('span', { class: 'badge ok' }, 'A tiempo')));
    });
    renderedKeys = nextKeys;
  }

  function renderAlerts() {
    const ul = $('#alerts');
    ul.textContent = '';
    if (!state.alertas.length) {
      ul.append(h('li', { class: 'empty' }, 'Sin alertas abiertas. El modelo no detect\u00f3 patrones inusuales en los registros recientes.'));
      return;
    }
    state.alertas.forEach((a) => {
      const sev = SEVERIDAD[a.severidad] ? a.severidad : 'baja';
      const score = typeof a.puntaje === 'number' ? a.puntaje.toFixed(2).replace('.', ',') : null;
      ul.append(h('li', { class: 'alert ' + sev },
        h('span', { class: 'sev' }, SEVERIDAD[sev]),
        h('h3', {}, TIPOS[a.tipo] || a.tipo),
        h('p', { class: 'who' }, a.nombre + (a.grado ? ' \u00b7 ' + a.grado : '')),
        h('p', { class: 'desc' }, a.descripcion),
        h('div', { class: 'foot' },
          score ? h('span', {}, 'Puntaje del modelo: ' + score) : null,
          h('button', { type: 'button', onclick: () => reviewAlert(a) }, 'Marcar como revisada'))));
    });
  }

  function render() {
    const d = derive();
    renderStatus(); renderLast(d); renderKpis(d); renderChart(d); renderFeed(d); renderAlerts();
  }

  /* ---------- Acciones ---------- */
  function removeAlert(id) { state.alertas = state.alertas.filter((x) => x.id_alerta !== id); $('#msg').textContent = ''; render(); }
  function reviewAlert(a) {
    if (demo) { removeAlert(a.id_alerta); return; }
    fetch(CONFIG.API_BASE + '/api/alertas/' + encodeURIComponent(a.id_alerta), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ revisada: true })
    }).then((r) => { if (!r.ok) throw new Error(r.status); removeAlert(a.id_alerta); })
      .catch(() => { $('#msg').textContent = 'No se pudo marcar la alerta como revisada. Intenta de nuevo.'; });
  }

  function poll() {
    fetch(CONFIG.API_BASE + '/api/dashboard?id_establecimiento=' + encodeURIComponent(CONFIG.ID_ESTABLECIMIENTO), { headers: { Accept: 'application/json' } })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((data) => {
        state.total = Number(data.total_estudiantes) || 0;
        state.lecturas = Array.isArray(data.lecturas) ? data.lecturas : [];
        state.alertas = Array.isArray(data.alertas) ? data.alertas : [];
        state.connected = true;
        state.updated = new Date();
        render();
      })
      .catch(() => { state.connected = false; renderStatus(); });
  }

  function demoTick() {
    if (demoShown >= demoAll.length) { clearInterval(demoTimer); return; }
    demoShown++;
    state.lecturas = demoAll.slice(0, demoShown);
    render();
  }

  /* ---------- Inicio ---------- */
  $('#subtitle').textContent = CONFIG.INSTITUCION + ' \u00b7 ' + new Date().toLocaleDateString('es-GT', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' });
  $('#search').addEventListener('input', (e) => { state.filter = e.target.value; renderFeed(derive()); });

  if (demo) {
    buildDemo();
    render();
    demoTimer = setInterval(demoTick, CONFIG.DEMO_CADA_MS);
  } else {
    render();
    poll();
    setInterval(poll, CONFIG.INTERVALO_MS);
  }
})();
</script>
</body>
</html>
