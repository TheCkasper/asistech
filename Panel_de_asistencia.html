<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel de asistencia</title>

  <!-- Fuentes tipográficas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap"
    rel="stylesheet">

  <!-- Estilos CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="wrap">
    <!-- ======================================================================
         1. CABECERA: Título, fecha y estado de conexión
         ====================================================================== -->
    <header class="top">
      <div class="brand">
        <h1>ASISTECH</h1>
        <p id="subtitle"></p>
      </div>
      <span id="conn" class="chip" role="status">
        <span class="dot" aria-hidden="true"></span>
        <span id="connText"></span>
      </span>
    </header>

    <!-- ======================================================================
         2. ÚLTIMA LECTURA: Notificación y animación en tiempo real
         ====================================================================== -->
    <section class="last" aria-label="Última lectura">
      <span id="pulse" class="pulse" aria-hidden="true"></span>
      <div aria-live="polite">
        <div id="lastName" class="last-name"></div>
        <p id="lastMeta" class="last-meta"></p>
      </div>
    </section>

    <!-- ======================================================================
         3. INDICADORES (KPIs): Métricas clave de asistencia
         ====================================================================== -->
    <section class="kpis" aria-label="Resumen del día">
      <div class="kpi">
        <div class="v" id="kPresentes">0</div>
        <div class="l">Presentes</div>
        <div class="s" id="kPresentesSub"></div>
      </div>
      <div class="kpi">
        <div class="v" id="kPct">&mdash;</div>
        <div class="l">Asistencia</div>
        <div class="s">de los estudiantes registrados</div>
      </div>
      <div class="kpi">
        <div class="v" id="kTarde">0</div>
        <div class="l">Llegaron tarde</div>
        <div class="s" id="kTardeSub"></div>
      </div>
      <div class="kpi">
        <div class="v" id="kAlertas">0</div>
        <div class="l">Alertas abiertas</div>
        <div class="s">por revisar</div>
      </div>
    </section>

    <!-- ======================================================================
         4. PANELES PRINCIPALES: Gráfica, Lecturas y Alertas de IA
         ====================================================================== -->
    <div class="cols">
      <!-- Columna izquierda: Gráfica y Lecturas en vivo -->
      <div class="stack">
        <!-- Gráfica de intervalos de 15 minutos -->
        <section class="panel" aria-labelledby="hChart">
          <h2 id="hChart">Entradas cada 15 minutos</h2>
          <p class="hint" id="chartHint"></p>
          <div id="chart" class="chart" role="img"></div>
          <div id="axis" class="axis" aria-hidden="true"></div>
          <div class="legend" id="chartLegend"></div>
        </section>

        <!-- Feed de lecturas en vivo con filtro de búsqueda -->
        <section class="panel" aria-labelledby="hFeed">
          <div class="panel-head">
            <h2 id="hFeed">Lecturas en vivo</h2>
            <label class="sr-only" for="search">Buscar por nombre</label>
            <input id="search" class="search" type="search" placeholder="Buscar por nombre" autocomplete="off">
          </div>
          <ul id="feed" class="feed"></ul>
        </section>
      </div>

      <!-- Columna derecha: Alertas de la IA -->
      <aside class="panel" aria-labelledby="hAlerts">
        <h2 id="hAlerts">Alertas de la IA</h2>
        <p class="hint">Patrones inusuales que detectó el modelo en los registros.</p>
        <ul id="alerts" class="alerts"></ul>
        <p id="msg" class="msg" role="status"></p>
      </aside>
    </div>
  </div>

  <!-- Lógica JavaScript -->
  <script src="js/app.js"></script>
</body>

</html>
